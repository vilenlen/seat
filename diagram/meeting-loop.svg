<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 560">
  <style>
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', 'SF Mono', 'Cascadia Code', -apple-system, sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f8fafc" stroke-width="0.8"/>
    </pattern>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97706"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e11d48"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="660" height="560" fill="#ffffff"/>
  <rect width="660" height="560" fill="url(#grid)"/>

  <!-- Title -->
  <text x="330" y="30" fill="#0f172a" font-size="17" font-weight="700" text-anchor="middle">会议循环状态机</text>
  <text x="330" y="47" fill="#94a3b8" font-size="9" text-anchor="middle">Meeting Loop · AI 角色自动循环推进讨论</text>

  <!-- ============ ARROWS (behind nodes) ============ -->

  <!-- Loop back lanes use OUTSIDE edges to avoid crossings.
       Layout cross: thinking(top) / competing(mid-left) / speaking(mid-right) / idle(bottom) -->

  <!-- ① thinking → competing  (amber, curve down-left) -->
  <path d="M 265 100 C 200 128, 140 175, 125 218" fill="none" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
  <text x="170" y="168" fill="#d97706" font-size="9" font-weight="600">want=true · 举手</text>

  <!-- ② competing → speaking  (emerald, straight horizontal across middle) -->
  <line x1="205" y1="250" x2="435" y2="250" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow-emerald)"/>
  <text x="320" y="242" fill="#059669" font-size="9" font-weight="600" text-anchor="middle">随机中签一人</text>

  <!-- ③ speaking → thinking  (blue, right outside lane x=560, enters right side of thinking) -->
  <path d="M 518 220 L 560 220 L 560 91 L 420 91" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <text x="548" y="158" fill="#2563eb" font-size="8" font-weight="600" text-anchor="end" transform="rotate(-90, 548, 158)">发言结束 → 回到思考</text>

  <!-- ④ thinking → idle  (rose dashed, right outer lane x=620, enters top of idle) -->
  <path d="M 395 100 Q 580 115 620 200 L 620 430 Q 620 440 610 440 L 420 440" fill="none" stroke="#e11d48" stroke-width="1.6" stroke-dasharray="6,3" marker-end="url(#arrow-rose)"/>
  <text x="605" y="310" fill="#e11d48" font-size="8" font-weight="600" text-anchor="end" transform="rotate(-90, 605, 310)">无人举手 → 等待你发言</text>

  <!-- ⑤ idle → thinking  (slate, left outer lane x=40, enters left of thinking) -->
  <path d="M 265 440 L 40 440 L 40 70 Q 40 60 50 60 L 240 60" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <text x="55" y="280" fill="#475569" font-size="8" font-weight="600" text-anchor="middle" transform="rotate(-90, 55, 280)">你插话 → 新一轮思考</text>

  <!-- ============ NODES ============ -->

  <!-- thinking (top center) — blue -->
  <rect x="240" y="60" width="180" height="62" rx="10" fill="#ffffff"/>
  <rect x="240" y="60" width="180" height="62" rx="10" fill="rgba(37,99,235,0.06)" stroke="#2563eb" stroke-width="2"/>
  <text x="330" y="86" fill="#2563eb" font-size="13" font-weight="700" text-anchor="middle">thinking</text>
  <text x="330" y="104" fill="#64748b" font-size="9" text-anchor="middle">并行思考 · 判断是否发言</text>

  <!-- competing (middle left) — amber -->
  <rect x="40" y="220" width="165" height="62" rx="10" fill="#ffffff"/>
  <rect x="40" y="220" width="165" height="62" rx="10" fill="rgba(217,119,6,0.06)" stroke="#d97706" stroke-width="2"/>
  <text x="122" y="246" fill="#d97706" font-size="13" font-weight="700" text-anchor="middle">competing</text>
  <text x="122" y="264" fill="#64748b" font-size="9" text-anchor="middle">举手 · 抢锁竞争</text>

  <!-- speaking (middle right) — emerald -->
  <rect x="435" y="220" width="165" height="62" rx="10" fill="#ffffff"/>
  <rect x="435" y="220" width="165" height="62" rx="10" fill="rgba(5,150,105,0.06)" stroke="#059669" stroke-width="2"/>
  <text x="518" y="246" fill="#059669" font-size="13" font-weight="700" text-anchor="middle">speaking</text>
  <text x="518" y="264" fill="#64748b" font-size="9" text-anchor="middle">一人发言 · 打字机输出</text>

  <!-- idle (bottom center) — slate pill -->
  <rect x="240" y="410" width="180" height="62" rx="30" fill="#ffffff"/>
  <rect x="240" y="410" width="180" height="62" rx="30" fill="rgba(100,116,139,0.06)" stroke="#64748b" stroke-width="2"/>
  <text x="330" y="436" fill="#475569" font-size="13" font-weight="700" text-anchor="middle">idle</text>
  <text x="330" y="454" fill="#94a3b8" font-size="9" text-anchor="middle">空闲 / 聆听 / 等待你</text>

  <!-- Legend -->
  <line x1="40" y1="505" x2="620" y2="505" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="525" fill="#94a3b8" font-size="8">顶层 phase: idle | thinking | competing | speaking　　会议 status: setup | running | paused | ended</text>
  <text x="40" y="540" fill="#94a3b8" font-size="8">
    <tspan fill="#059669">■</tspan> 正常发言　　
    <tspan fill="#2563eb">■</tspan> 发言结束返回　　
    <tspan fill="#e11d48">━ ━</tspan> 无人举手（等待主持人）　　
    <tspan fill="#64748b">■</tspan> 你插话触发新一轮
  </text>
</svg>
